[project]
name = "valutatrade-hub"
version = "1.0.0"
description = "Учебное CLI-приложение для симуляции валютного портфеля"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prettytable>=3.12.0",
    "requests>=2.32.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.valutatrade]
DATA_DIR = "data"
USERS_FILE = "data/users.json"
PORTFOLIOS_FILE = "data/portfolios.json"
RATES_FILE = "data/rates.json"
HISTORY_FILE = "data/exchange_rates.json"
RATES_TTL_SECONDS = 300
BASE_CURRENCY = "USD"
LOG_DIR = "logs"
LOG_LEVEL = "INFO"
